<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Gospel music cover with a Christian cross and Khup Muang logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183a46"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4c8"/>
      <stop offset="1" stop-color="#e2b767"/>
    </linearGradient>
    <filter id="glow" x="-.6" y="-.6" width="2.2" height="2.2">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="shadow" x="-.4" y="-.4" width="1.8" height="1.8">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="42" fill="url(#bg)"/>
  <circle cx="326" cy="286" r="170" fill="#f4c96d" opacity=".15" filter="url(#glow)"/>
  <circle cx="326" cy="286" r="205" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="2"/>
  <g filter="url(#shadow)" fill="url(#cross)">
    <rect x="301" y="133" width="50" height="297" rx="8"/>
    <rect x="211" y="218" width="230" height="50" rx="8"/>
    <path d="M176 435c48 24 101 37 150 37s102-13 150-37" fill="none" stroke="#b4f06a" stroke-opacity=".82" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g fill="#b4f06a" opacity=".88">
    <path d="M162 175c19-20 38-20 57 0-19 20-38 20-57 0zm351 63c16-17 32-17 48 0-16 17-32 17-48 0z"/>
    <circle cx="211" cy="151" r="5"/><circle cx="491" cy="180" r="4"/><circle cx="461" cy="337" r="5"/>
  </g>
  <rect x="38" y="38" width="104" height="104" rx="25" fill="#fff"/>
  <image href="logo.jpeg" x="40" y="40" width="100" height="100" preserveAspectRatio="xMidYMid slice"/>
  <text x="42" y="523" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">GOSPEL</text>
  <text x="44" y="558" fill="#b4f06a" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">FAITH • HOPE • MUSIC</text>
</svg>
