<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Myanmar playlist cover with the Myanmar flag and Khup Muang logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232039"/>
      <stop offset="1" stop-color="#10131b"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf32"/>
      <stop offset=".34" stop-color="#ffcf32"/>
      <stop offset=".34" stop-color="#34a853"/>
      <stop offset=".67" stop-color="#34a853"/>
      <stop offset=".67" stop-color="#ea3434"/>
      <stop offset="1" stop-color="#ea3434"/>
    </linearGradient>
    <filter id="shadow" x="-.25" y="-.35" width="1.5" height="1.7">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="42" fill="url(#bg)"/>
  <circle cx="337" cy="276" r="226" fill="#b4f06a" opacity=".06"/>
  <circle cx="337" cy="276" r="197" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
  <g transform="rotate(-7 326 284)" filter="url(#shadow)">
    <rect x="105" y="163" width="442" height="264" rx="24" fill="url(#flag)"/>
    <rect x="105" y="163" width="442" height="264" rx="24" fill="none" stroke="#fff" stroke-opacity=".86" stroke-width="5"/>
    <path d="M326 205l19 56 59 0-48 35 18 57-48-35-48 35 18-57-48-35h59z" fill="#fff"/>
  </g>
  <rect x="38" y="38" width="104" height="104" rx="25" fill="#fff"/>
  <image href="logo.jpeg" x="40" y="40" width="100" height="100" preserveAspectRatio="xMidYMid slice"/>
  <text x="42" y="523" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1">MYANMAR</text>
  <text x="44" y="558" fill="#b4f06a" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">LOCAL MUSIC COLLECTION</text>
